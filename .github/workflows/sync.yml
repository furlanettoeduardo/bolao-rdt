# Sincroniza placares a cada 5 minutos chamando POST /api/cron/sync.
#
# O plano Hobby da Vercel só permite crons diários, então este workflow é o
# caminho para placares quase em tempo real durante os jogos.
#
# Configure nos Secrets do repositório (Settings → Secrets and variables → Actions):
#   APP_URL     → URL pública da aplicação, sem barra final (ex.: https://bolao-rdt.vercel.app)
#   CRON_SECRET → o mesmo valor da env CRON_SECRET na Vercel
#
# Observação: o GitHub Actions não garante execução pontual de schedules — em
# horários de pico pode haver atraso de alguns minutos. Para mais precisão,
# use também um serviço como cron-job.org apontando para o mesmo endpoint.

name: Sincronizar placares

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar endpoint de sincronização
        run: |
          curl --fail-with-body -sS -X POST "$APP_URL/api/cron/sync?scope=window" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 60
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
